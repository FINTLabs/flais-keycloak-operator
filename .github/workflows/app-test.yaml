name: FLAIS Keycloak Operator Application Tests

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - src/**
            - build.gradle.kts
            - settings.gradle.kts
            - gradle/**

concurrency:
    group: app-test-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read
    checks: write

jobs:
    check-formatting:
        name: Check code formatting
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup Java
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 21

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Run ktlint Check
                run: ./gradlew ktlintCheck --stacktrace --configuration-cache

    integration-tests:
        name: Run Integration Tests
        runs-on: ubuntu-latest-8-cores
        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup Java
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 21

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Run Integration Tests
                run: ./gradlew integrationTest --stacktrace --configuration-cache

            -   name: Integration Test Reports
                uses: dorny/test-reporter@v3.0.0
                if: always()
                with:
                    name: Integration Test Reports
                    path: "build/test-results/integrationTest/*.xml"
                    reporter: java-junit
