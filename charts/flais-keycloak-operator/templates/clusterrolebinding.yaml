{{- if .Values.serviceAccount.create -}}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "ssoerator2.fullname" . }}
  labels:
    {{- include "ssoerator2.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ssoerator2.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ssoerator2.serviceAccountName" . }}
    namespace: "{{ .Release.Namespace }}"
{{- end }}