apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "flais-keycloak-operator.fullname" . }}
  labels:
    {{- include "flais-keycloak-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - "novari.no"
    resources:
      - "flaisauthentications"
      - "flaisauthentications/status"
      - "flaisauthentications/finalizers"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"

  - apiGroups:
      - "apiextensions.k8s.io"
    resources:
      - "customresourcedefinitions"
    verbs:
      - "get"
      - "list"

  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
