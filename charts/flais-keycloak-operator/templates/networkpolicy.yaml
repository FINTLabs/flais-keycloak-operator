apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flais-keycloak-operator.fullname" . }}-prometheus
  labels:
    {{- include "flais-keycloak-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flais-keycloak-operator.selectorLabels" . | nindent 6 }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress